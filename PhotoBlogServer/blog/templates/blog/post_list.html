{% extends 'blog/base.html' %}

{% block content %}

    {% for post in posts %}

        <div class="post">

            <div class="date">
                {{ post.published_date }}
            </div>

            <h1>
                <a href="{% url 'post_detail' pk=post.pk %}">
                    {{ post.title }}
                </a>
            </h1>

            <p>
                {{ post.text|linebreaksbr }}
            </p>

            {% if post.image %}
                <div class="post-image">
                    <img
                        src="{{ post.image.url }}"
                        alt="{{ post.title }}"
                        style="max-width: 100%; width: 320px; height: auto; margin: 10px 0 30px;"
                    >
                </div>
            {% endif %}

        </div>

    {% empty %}

        <p>No detection records available.</p>

    {% endfor %}

{% endblock %}
